last_reviewed: 2026-09-10
reviewed_by: Amy Tao, confirmed via Matthew 2026-09-10 (AI-agent verification)

categories:
  - id: life
    title:
      zh: 人寿保险
      en: Life Insurance
    questions:
      - id: how-much-life-cover
        q:
          zh: 我需要多少人寿保险？
          en: How much life insurance do I need?
        a:
          zh:
            - |-
              我们给客户定保额，不用“年收入几倍”的经验法则，而是按家庭真实的缺口来算：<strong>房贷余额 + 子女到经济独立前的教育费用 + 若干年的家庭生活开支</strong>，再加上其他债务，减去已有的储蓄和保障。例如，房贷还有 $60 万，子女教育需要 $15 万，10 年生活费 $70 万，那么大约需要 $145 万的保额。保额不是越高越好，要和保费放在一起看，找到家庭负担得起、又真正能填上缺口的那个数。
          en:
            - |-
              We do not size cover with an income-multiple rule of thumb. We work out the family's real gap: <strong>mortgage balance + children's education until they are financially independent + a number of years of household living costs</strong>, plus any other debts, less existing savings and cover. For example, with a $600k mortgage, $150k for children's education and $700k for 10 years of living costs, you would need around $1.45M of cover. More is not automatically better — the sum insured has to be weighed against the premium to find the amount the family can afford that genuinely closes the gap.

      - id: term-vs-whole-life
        q:
          zh: 定期寿险和终身寿险有什么区别？
          en: What's the difference between term and whole life insurance?
        a:
          zh:
            - |-
              新西兰市面上的人寿险基本都是<strong>纯保障型</strong>的：每年交保费换取身故赔付，没有现金价值，中途取消或到期都不返还，和中国常见的储蓄型、分红型“终身寿险”不是一回事。
            - |-
              <strong>保到什么时候：</strong>大多数产品是可续保的定期寿险，可以一直保到你取消或达到条款的年龄上限；也有专门保终身的产品（例如 AIA Cover for Life），但条款同样写明没有退保价值或现金价值。
            - |-
              <strong>真正要选的是保费结构：</strong>浮动保费（stepped）年轻时便宜、每年随年龄上涨；固定保费（level）前期贵一些，但在选定期限内不随年龄上涨，长期总保费通常更低，也是给孩子买重疾险时常见的选择。
          en:
            - |-
              Almost all life insurance sold in New Zealand is <strong>pure protection</strong>: you pay premiums for a death benefit, there is no cash value, and nothing is returned if you cancel or the cover ends. It is different from the savings-style whole-of-life policies common in China.
            - |-
              <strong>How long it lasts:</strong> most products are renewable term cover that continues until you cancel or reach the policy's age limit. A few products cover you for life (for example AIA Cover for Life), but their wording also states there is no surrender or cash value.
            - |-
              <strong>The real choice is the premium structure:</strong> stepped premiums start cheap and rise every year with age; level premiums cost more at first but stay flat for the chosen term regardless of age, usually cost less over the long run, and are a common choice for children's trauma cover.

      - id: group-cover-enough
        q:
          zh: 我已经有工作单位的团体保险，还需要个人保险吗？
          en: I have group insurance through work, do I still need personal insurance?
        a:
          zh:
            - |-
              通常需要。团体保险的保额往往不足（通常只有1-2倍年薪），且在您离职时会失效。个人保险可以补充不足的保额，并且是可携带的，不受工作变动影响。
          en:
            - |-
              Usually yes. Group insurance coverage is often insufficient (typically only 1-2 times annual salary) and ends when you leave your job. Personal insurance can supplement the coverage gap and is portable, unaffected by job changes.

  - id: health
    title:
      zh: 健康保险
      en: Health Insurance
    questions:
      - id: health-vs-acc
        q:
          zh: 私人健康保险和ACC有什么区别？
          en: What's the difference between private health insurance and ACC?
        a:
          zh:
            - |-
              <strong>ACC：</strong>只覆盖意外伤害，包括医疗费用和收入补偿（80%），但不覆盖疾病。
            - |-
              <strong>私人健康保险：</strong>覆盖疾病和医疗条件，提供更快的治疗途径和更多选择，但不覆盖意外（由ACC处理）。
          en:
            - |-
              <strong>ACC:</strong> Only covers accidental injuries, including medical costs and income compensation (80%), but doesn't cover illness.
            - |-
              <strong>Private Health Insurance:</strong> Covers illness and medical conditions, provides faster treatment access and more choice, but doesn't cover accidents (handled by ACC).

      - id: waiting-periods
        q:
          zh: 等待期是什么意思？
          en: What are waiting periods?
        a:
          zh:
            - |-
              要分险种看。<strong>医疗险：</strong>新西兰的私人医疗险一般<strong>没有</strong>一般性等待期，保单生效后新发生的疾病就可以理赔（前提是投保时如实告知）。只有个别项目有等待期，比如有的公司拔智齿要等 1 年，忠诚福利要投保 2–3 年，孕产福利要 1–2 年。保险公司靠“既往症排除”管理风险，而不是让你等半年。
            - |-
              <strong>重疾险：</strong>癌症、心脏病、中风等主要疾病通常有 90 天（3 个月）的等待期，投保后 3 个月内确诊不赔。
            - |-
              <strong>收入保障险：</strong>这里的“等待期”是另一个概念——你在投保时自己选择的免赔期（常见 4 周到 2 年），失去工作能力超过这段时间后，才开始按月赔付。
          en:
            - |-
              It depends on the type of cover. <strong>Health insurance:</strong> private medical cover in New Zealand generally has <strong>no</strong> general waiting period — conditions that start after the policy begins can be claimed, provided you disclosed honestly. Only specific benefits carry waits: some insurers require 1 year for wisdom teeth, 2–3 years for loyalty benefits, 1–2 years for maternity benefits. Insurers manage risk with pre-existing condition exclusions, not by making you wait six months.
            - |-
              <strong>Trauma insurance:</strong> the major conditions (cancer, heart attack, stroke) usually carry a 90-day stand-down; a diagnosis within 3 months of the start date is not paid.
            - |-
              <strong>Income protection:</strong> here “waiting period” means something different — the elimination period you choose at application (commonly 4 weeks to 2 years) that must pass before monthly benefits begin.

      - id: pre-existing-conditions
        q:
          zh: 既往症会被覆盖吗？
          en: Are pre-existing conditions covered?
        a:
          zh:
            - |-
              既往症通常不被覆盖，或者有特殊的等待期和限制。在申请时诚实披露所有健康状况非常重要。有些保险公司可能会接受某些既往症，但会有额外的保费或排除条款。
          en:
            - |-
              Pre-existing conditions are usually not covered, or have special waiting periods and restrictions. It's crucial to honestly disclose all health conditions when applying. Some insurers may accept certain pre-existing conditions but with additional premiums or exclusions.

  - id: income-protection
    title:
      zh: 收入保障保险
      en: Income Protection Insurance
    questions:
      - id: how-income-protection-works
        q:
          zh: 收入保障保险是如何运作的？
          en: How does income protection insurance work?
        a:
          zh:
            - |-
              如果您因疾病或受伤无法工作，收入保障险会在您选择的等待期（常见 4 周到 2 年，如 4/8/13/26/52/104 周）之后，每月支付您税前收入的一定比例（通常最高 75%；有的产品按事先约定的固定金额赔付）。赔付持续到您能重返工作、或达到保单约定的赔付期限或年龄（如 65 岁）为止。
          en:
            - |-
              If you cannot work because of illness or injury, income protection pays a monthly benefit after the waiting period you chose (commonly 4 weeks to 2 years, e.g. 4/8/13/26/52/104 weeks). The benefit is typically up to 75% of your pre-disability income, or a pre-agreed fixed amount on agreed-value products. Payments continue until you can return to work or reach the policy's benefit period or age limit (e.g. 65).

      - id: which-waiting-period
        q:
          zh: 应该选择多长的等待期？
          en: What waiting period should I choose?
        a:
          zh:
            - |-
              这取决于您的应急储蓄和病假福利。如果您有3个月的储蓄，可以选择90天等待期以降低保费。如果储蓄有限，建议选择30天等待期。记住等待期越短，保费越高。
          en:
            - |-
              This depends on your emergency savings and sick leave benefits. If you have 3 months of savings, you can choose a 90-day waiting period to reduce premiums. If savings are limited, consider a 30-day waiting period. Remember, shorter waiting periods mean higher premiums.

      - id: own-vs-any-occupation
        q:
          zh: “自己职业”和“任何职业”定义有什么区别？
          en: What's the difference between "own occupation" and "any occupation" definitions?
        a:
          zh:
            - |-
              <strong>自己职业：</strong>如果您无法从事自己的具体工作就可以获得赔付，保障更全面但保费更高。
            - |-
              <strong>任何职业：</strong>只有当您无法从事任何适合您教育和经验的工作时才赔付，保费较低但限制更多。
          en:
            - |-
              <strong>Own Occupation:</strong> Pays if you can't perform your specific job, more comprehensive but higher premiums.
            - |-
              <strong>Any Occupation:</strong> Only pays if you can't work in any job suited to your education and experience, lower premiums but more restrictive.

  - id: claims
    title:
      zh: 理赔相关
      en: Claims Related
    questions:
      - id: claim-processing-time
        q:
          zh: 理赔需要多长时间？
          en: How long do claims take to process?
        a:
          zh:
            - |-
              因保险类型和复杂程度而异，没有统一标准。一般来说，医疗险的门诊和检查报销最快，几个工作日到两周；手术住院如果事先做了预批，出院后报销也很快。人寿险和重疾险需要医疗证明、有时要调阅病历，通常以周计；收入保障险要评估工作能力，往往最久。及时提供完整文件、让顾问帮你跟进，是加快速度最有效的办法。
          en:
            - |-
              It varies by cover type and complexity; there is no standard timeframe. Broadly, outpatient and diagnostic claims on health insurance are fastest (a few working days to two weeks), and surgery or hospital claims that were pre-approved are paid quickly after discharge. Life and trauma claims need medical evidence and sometimes medical records, so they usually take weeks; income protection claims require an assessment of your capacity to work and often take longest. Complete documents submitted promptly, with your adviser following up, is the most effective way to speed things up.

      - id: claim-declined
        q:
          zh: 理赔被拒绝了怎么办？
          en: What if my claim is declined?
        a:
          zh:
            - |-
              先要求保险公司给出<strong>书面</strong>拒赔理由。很多拒赔其实有争取的空间——这正是保险顾问的价值：代表你去和保险公司沟通、补资料、申诉。如果仍不满意，走保险公司的内部投诉程序（保险公司有 2 个月的处理时间）；仍未解决或已达 deadlock，可以在 3 个月内向保险与金融服务申诉专员（IFSO Scheme，电话 0800 888 202）投诉，这是独立且对消费者<strong>免费</strong>的争议解决机构。
          en:
            - |-
              First ask the insurer for the reason in <strong>writing</strong>. Many declines can be challenged — that is exactly where an adviser earns their keep, by dealing with the insurer, supplying further evidence and appealing on your behalf. If you are still unhappy, use the insurer's internal complaints process (they have 2 months to resolve it). If it remains unresolved or reaches deadlock, you have 3 months to take it to the Insurance & Financial Services Ombudsman Scheme (IFSO, 0800 888 202), an independent service that is <strong>free</strong> for consumers.

      - id: claim-documents
        q:
          zh: 理赔需要准备哪些文件？
          en: What documents do I need for a claim?
        a:
          zh:
            - |-
              通常需要：理赔申请表、医疗证明、医生报告、收据和发票、身份证明、保单文件。对于收入保障理赔，还需要雇主证明和收入证明。建议保留所有相关文件的副本。
          en:
            - |-
              Typically needed: Claim forms, medical certificates, doctor's reports, receipts and invoices, proof of identity, policy documents. For income protection claims, also employer confirmation and proof of income. Keep copies of all relevant documents.

  - id: premiums
    title:
      zh: 保费和费用
      en: Premiums and Costs
    questions:
      - id: will-premiums-increase
        q:
          zh: 保费会涨价吗？
          en: Will my premiums increase?
        a:
          zh:
            - |-
              <strong>医疗险：</strong>每家都一定会涨。保费按年龄段定价，再叠加医疗通胀和保险公司整体的赔付情况，与你个人有没有理赔无关，所以该赔就赔。
            - |-
              <strong>人寿险、重疾险等：</strong>看你选的保费结构。浮动保费（stepped）每年随年龄上涨；固定保费（level）在选定期限内不随年龄上涨，但除非条款注明 Guaranteed，保险公司通常保留调整整体费率的权利（例如 Partners Life 和 Chubb 的条款都把固定保费分成 Guaranteed 和 Non-Guaranteed 两种，保证的那种更贵）。有的公司还会在投保两年后给逐年递增的忠诚折扣。
          en:
            - |-
              <strong>Health insurance:</strong> every insurer's premiums rise. They are priced by age band and then adjusted for medical inflation and the insurer's overall claims experience — not your personal claims, so claim when you need to.
            - |-
              <strong>Life, trauma and similar covers:</strong> it depends on the premium structure you chose. Stepped premiums rise every year with age; level premiums do not rise with age for the chosen term, but unless the policy says Guaranteed, the insurer usually keeps the right to review its overall rates (Partners Life and Chubb, for example, both distinguish Guaranteed from Non-Guaranteed level premiums in their wordings, with the guaranteed version costing more). Some insurers also add a loyalty discount that grows each year after the second year.

      - id: premiums-tax-deductible
        q:
          zh: 保险费可以税务抵扣吗？
          en: Are insurance premiums tax deductible?
        a:
          zh:
            - |-
              人寿险、重疾险、医疗险的个人保费<strong>不能</strong>抵税，理赔金也<strong>不用</strong>交税。收入保障险要分两种：赔付金按收入征税的（indemnity / loss of earnings 类），保费可以抵扣；赔付金免税的（agreed value 类），保费不能抵扣——IRD 的原则是“赔付要交税，保费才能抵”。企业主为员工或关键人买的保险另有规定。具体到你的情况，请咨询会计师。
          en:
            - |-
              Personal premiums for life, trauma and health insurance are <strong>not</strong> tax deductible, and the payouts are <strong>not</strong> taxed. Income protection comes in two kinds: where the benefit is taxable as income (indemnity / loss-of-earnings types) the premiums are deductible; where the benefit is tax-free (agreed value) the premiums are not — Inland Revenue's rule is that premiums are deductible only if the payout would be taxable. Business owners insuring staff or key people have separate rules. Check your own situation with an accountant.

      - id: reduce-insurance-costs
        q:
          zh: 如何降低保险费用？
          en: How can I reduce insurance costs?
        a:
          zh:
            - |-
              几种方法：提高免赔额、选择较长等待期、打包多种保险、保持健康生活方式获得折扣、选择阶梯式保费（年轻时较便宜）、货比三家找最优价格。
          en:
            - |-
              Several ways: Increase excess/deductibles, choose longer waiting periods, bundle multiple insurances, maintain healthy lifestyle for discounts, choose stepped premiums (cheaper when young), shop around for best prices.

  - id: underwriting
    title:
      zh: 申请和承保
      en: Application and Underwriting
    questions:
      - id: medical-exam-required
        q:
          zh: 申请保险需要体检吗？
          en: Do I need a medical exam to apply for insurance?
        a:
          zh:
            - |-
              一般<strong>不需要</strong>。新西兰买保险主要是填一份健康问卷，按最大诚信原则如实回答；保险公司有时会向你的家医调阅病历来核保。只有在保额很高、或健康描述和病历都不足以判断时，保险公司才可能要求体检或验血，这种情况比较少见。
          en:
            - |-
              Usually <strong>no</strong>. Applying for insurance in New Zealand mainly involves a health questionnaire, answered honestly under the duty of disclosure; insurers sometimes obtain your GP records to underwrite. Only for very large sums insured, or when the questionnaire and records are not enough to assess you, might an insurer ask for a medical exam or blood tests — and that is relatively uncommon.

      - id: apply-after-decline
        q:
          zh: 申请被拒绝后还能申请其他保险公司吗？
          en: Can I apply to other insurers if I'm declined?
        a:
          zh:
            - |-
              可以，但您必须在新申请中披露之前被拒绝的情况。不同保险公司有不同的承保标准，一家拒绝不意味着所有公司都会拒绝。建议咨询保险顾问寻找最适合的保险公司。
          en:
            - |-
              Yes, but you must disclose previous declines in new applications. Different insurers have different underwriting standards, so a decline from one doesn't mean all will decline. Consider consulting an insurance advisor to find the most suitable insurer.

      - id: best-time-to-buy
        q:
          zh: 什么时候是购买保险的最佳时机？
          en: When is the best time to buy insurance?
        a:
          zh:
            - |-
              越早越好！年轻时保费最便宜，健康状况通常最好，更容易获得承保。重要的人生节点如结婚、买房、生孩子时都应该重新评估保险需求。不要等到健康出现问题才考虑保险。
          en:
            - |-
              The sooner the better! Premiums are cheapest when young, health is usually best, and it's easier to get coverage. Important life events like marriage, buying a home, having children should trigger insurance needs reassessment. Don't wait until health issues arise to consider insurance.
